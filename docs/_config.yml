title: EventBridge Gate
description: Real-time AWS EventBridge event debugger for developers
theme: just-the-docs
color_scheme: egate

url: https://aka-somix.github.io
baseurl: /eventbridge-gate

aux_links:
  "GitHub":
    - https://github.com/aka-somix/eventbridge-gate

aux_links_new_tab: true

# Footer
footer_content: "Apache 2.0 License &mdash; <a href=\"https://github.com/aka-somix/eventbridge-gate\">aka-somix/eventbridge-gate</a>"

# Enable search
search_enabled: true

# Callouts
callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Apply default layout to all pages
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gem"
